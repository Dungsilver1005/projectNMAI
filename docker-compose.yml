services:
  database:
    image: mongo:7
    container_name: fraud-demo-database
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fraud_detection
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./fraud_backend
      dockerfile: Dockerfile
    container_name: fraud-demo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://database:27017/fraud_detection
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: 8000
      DASHBOARD_RATE_LIMIT_MAX: ${DASHBOARD_RATE_LIMIT_MAX:-2500}
      DASHBOARD_RATE_LIMIT_WINDOW_MINUTES: ${DASHBOARD_RATE_LIMIT_WINDOW_MINUTES:-15}
      HEALTH_RATE_LIMIT_MAX: ${HEALTH_RATE_LIMIT_MAX:-3000}
      HEALTH_RATE_LIMIT_WINDOW_MINUTES: ${HEALTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      TRANSACTION_RATE_LIMIT_MAX: ${TRANSACTION_RATE_LIMIT_MAX:-120}
      TRANSACTION_RATE_LIMIT_WINDOW_MINUTES: ${TRANSACTION_RATE_LIMIT_WINDOW_MINUTES:-15}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - backend_logs:/usr/src/app/logs

  ai-service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    container_name: fraud-demo-ai-service
    restart: unless-stopped
    environment:
      MODEL_ARTIFACT_DIR: /app/model_artifacts
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    container_name: fraud-demo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo_data:
  backend_logs:
